<!--
  Wazuh Agent configuration — Ubuntu Target VM
  Install on target: /var/ossec/etc/ossec.conf (merge with existing agent config)
  Manager IP and agent name must be adjusted for your lab.
  Reference: docs/architecture.md §3.1
-->
<ossec_config>
  <client>
    <server>
      <!-- Replace with your Wazuh Manager IP/hostname -->
      <address>192.168.56.30</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- SSH auth log — forwarded to Manager for rule 5712 / 100200 matching -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Optional: include active-responses log if you also use Wazuh Active Response (Option B) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories>/etc,/usr/bin,/usr/sbin</directories>
  </syscheck>
</ossec_config>
